name: Build PayPulse Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android wrapper
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init PayPulse com.ninewire.paypulse --web-dir=dist --npm-client=npm
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Package APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
          cd artifacts && zip PayPulse-Android-Debug-APK.zip app-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayPulse-Android-Debug-APK
          path: artifacts/PayPulse-Android-Debug-APK.zip
          if-no-files-found: error
